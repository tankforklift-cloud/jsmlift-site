<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <!-- M icon: uniform 12px stroke, geometric, Weidemann-style clean lines -->
  <g stroke="#4A3525" stroke-width="12" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" fill="none">
    <!-- V-shaped top -->
    <path d="M 6,16 L 33,58 L 60,16"/>
    <!-- Left pillar -->
    <line x1="6" y1="16" x2="6" y2="84"/>
    <!-- Right pillar -->
    <line x1="60" y1="16" x2="60" y2="84"/>
  </g>

  <!-- Gold vertical divider -->
  <rect x="74" y="26" width="3" height="46" rx="1.5" fill="#C8963E"/>

  <!-- MLIFT wordmark: Weidemann-style bold sans-serif -->
  <text x="92" y="54" font-family="system-ui, -apple-system, 'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="40" fill="#4A3525" letter-spacing="3">MLIFT</text>

  <!-- Tagline -->
  <text x="94" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10" fill="#A99A80" letter-spacing="9">TOUGH BY DESIGN</text>
</svg>
