<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="500" height="130">
  <defs>
    <!-- Inner shadow for icon circle -->
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="2" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
  </defs>

  <!-- ===== CIRCLE ICON ===== -->
  <!-- Outer ring -->
  <circle cx="60" cy="65" r="58" fill="none" stroke="#C8963E" stroke-width="4"/>
  <!-- Solid circle bg -->
  <circle cx="60" cy="65" r="54" fill="#4A3525"/>
  <!-- Inner subtle rim -->
  <circle cx="60" cy="65" r="50" fill="none" stroke="#C8963E" stroke-width="0.5" opacity="0.5"/>

  <!-- Bold geometric M -->
  <path d="M 25 85 L 35 45 L 60 65 L 85 45 L 95 85" 
        fill="none" stroke="#FCF9F5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== MLIFT TEXT ===== -->
  <text x="140" y="60" font-family="'Helvetica Neue', 'Arial', system-ui, sans-serif" font-weight="800" font-size="50" fill="#4A3525" letter-spacing="3">MLIFT</text>

  <!-- ===== TAGLINE ===== -->
  <text x="142" y="88" font-family="'Snell Roundhand', 'Apple Chancery', 'Segoe Script', 'Brush Script MT', 'Comic Sans MS', cursive" font-size="22" fill="#A99A80" font-style="italic" letter-spacing="0.5">designed for work</text>
</svg>
