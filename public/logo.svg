<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" width="360" height="110">
  <defs>
    <!-- 金属底板渐变 -->
    <linearGradient id="plateBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2E1F14"/>
      <stop offset="30%"  stop-color="#22140B"/>
      <stop offset="70%"  stop-color="#1A0E07"/>
      <stop offset="100%" stop-color="#120904"/>
    </linearGradient>
    <!-- 金色文字渐变 -->
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#E2C064"/>
      <stop offset="40%"  stop-color="#C8963E"/>
      <stop offset="100%" stop-color="#8B5E20"/>
    </linearGradient>
    <!-- 铆钉渐变 -->
    <radialGradient id="rivetGrad" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0%"   stop-color="#F0D078"/>
      <stop offset="60%"  stop-color="#C8963E"/>
      <stop offset="100%" stop-color="#7A4E15"/>
    </radialGradient>
    <!-- 底板高光线 -->
    <filter id="bevel">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.5" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="2" specularConstant="0.3" specularExponent="10" result="spec">
        <fePointLight x="-200" y="-200" z="50"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
    <!-- 文字压印效果 -->
    <filter id="deboss">
      <feOffset dx="1" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="0.8" result="blur"/>
      <feFlood flood-color="#000" flood-opacity="0.6" result="dark"/>
      <feComposite in="dark" in2="blur" operator="in" result="shadow"/>
      <feOffset dx="-0.5" dy="-0.5" in="SourceAlpha" result="off2"/>
      <feFlood flood-color="#FFEED0" flood-opacity="0.15" result="light"/>
      <feComposite in="light" in2="off2" operator="in" result="highlight"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="highlight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 金属铭牌底板 -->
  <rect x="2" y="2" width="356" height="106" rx="6" fill="url(#plateBg)" stroke="#3D2515" stroke-width="3"/>
  <rect x="4" y="4" width="352" height="102" rx="5" fill="none" stroke="#4A3020" stroke-width="0.5"/>

  <!-- 四角铆钉 -->
  <circle cx="18" cy="18" r="4.5" fill="url(#rivetGrad)"/>
  <circle cx="18" cy="18" r="2.5" fill="none" stroke="#1A0E07" stroke-width="0.5" opacity="0.4"/>

  <circle cx="342" cy="18" r="4.5" fill="url(#rivetGrad)"/>
  <circle cx="342" cy="18" r="2.5" fill="none" stroke="#1A0E07" stroke-width="0.5" opacity="0.4"/>

  <circle cx="18" cy="92" r="4.5" fill="url(#rivetGrad)"/>
  <circle cx="18" cy="92" r="2.5" fill="none" stroke="#1A0E07" stroke-width="0.5" opacity="0.4"/>

  <circle cx="342" cy="92" r="4.5" fill="url(#rivetGrad)"/>
  <circle cx="342" cy="92" r="2.5" fill="none" stroke="#1A0E07" stroke-width="0.5" opacity="0.4"/>

  <!-- 顶部金色装饰线 -->
  <line x1="40" y1="24" x2="320" y2="24" stroke="#C8963E" stroke-width="1" opacity="0.7"/>
  <rect x="40" y="23" width="280" height="1" fill="#C8963E" opacity="0.4"/>

  <!-- MLIFT 主文字（压印效果） -->
  <text x="180" y="58" text-anchor="middle"
        font-family="'Helvetica Neue', 'Arial Black', 'Impact', system-ui, -apple-system, sans-serif"
        font-weight="900" font-size="42" fill="url(#goldText)"
        letter-spacing="8" filter="url(#deboss)">MLIFT</text>

  <!-- 底部金色装饰线 -->
  <line x1="80" y1="72" x2="280" y2="72" stroke="#C8963E" stroke-width="0.8" opacity="0.5"/>

  <!-- 标语 -->
  <text x="180" y="90" text-anchor="middle"
        font-family="'Helvetica Neue', 'Arial', system-ui, -apple-system, sans-serif"
        font-weight="600" font-size="13" fill="#A99A80"
        letter-spacing="6">TOUGH BY DESIGN</text>
</svg>
