<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <defs>
    <linearGradient id="gold" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%"   stop-color="#DCB553"/>
      <stop offset="35%"  stop-color="#C8963E"/>
      <stop offset="100%" stop-color="#9C6820"/>
    </linearGradient>
    <linearGradient id="goldShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#C8963E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4A3525" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="drop" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3A2515" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- === M Monogram === -->
  <!-- Shadow layer -->
  <path d="M 26 90 L 15 16 L 52 55 L 89 16 L 78 90"
        fill="none" stroke="#4A3525" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"
        opacity="0.12" transform="translate(1.5 2)"/>

  <!-- Main M -->
  <path d="M 26 90 L 15 16 L 52 55 L 89 16 L 78 90"
        fill="none" stroke="url(#gold)" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#drop)"/>

  <!-- === MLIFT === -->
  <text x="125" y="57"
        font-family="'Helvetica Neue', 'Arial Black', system-ui, -apple-system, sans-serif"
        font-weight="900" font-size="48" fill="#4A3525" letter-spacing="2">MLIFT</text>

  <!-- === Tagline === -->
  <text x="127" y="94"
        font-family="'Helvetica Neue', 'Arial', system-ui, -apple-system, sans-serif"
        font-weight="300" font-size="18" fill="#A99A80"
        letter-spacing="4">Tough by design</text>

  <!-- === Subtle accent dot === -->
  <circle cx="120" cy="99" r="2" fill="#C8963E" opacity="0.4"/>
</svg>
